name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-release:
    if: "!contains(github.event.head_commit.message, 'chore: update OTA manifest')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=ota-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Preparando X40-Control ${VERSION}"

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Verify build host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = x64
          uname -m
          node --version
          node -p '"Node architecture: " + process.arch'
          test -x node_modules/upx/bin/upx-linux-amd64
          node_modules/upx/bin/upx-linux-amd64 --version

      - name: Generate OpenAPI schema
        run: npm run build_openapi_schema

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build Valetudo ARMv7
        run: npm run build_armv7 --workspace=backend

      - name: Build Valetudo ARMv7 lowmem
        run: npm run build_armv7_lowmem --workspace=backend

      - name: Build Valetudo ARM64
        run: npm run build_aarch64 --workspace=backend

      - name: Compress binaries with UPX
        run: npm run upx

      - name: Validate binaries and prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          # All six binaries are mandatory.
          for f in \
            build/armv7/valetudo \
            build/armv7/valetudo-lowmem \
            build/aarch64/valetudo \
            build/armv7/valetudo.upx \
            build/armv7/valetudo-lowmem.upx \
            build/aarch64/valetudo.upx
          do
            test -s "$f" || {
              echo "::error::Missing or empty artifact: $f"
              exit 1
            }
          done

          # Verify the architectures of the normal binaries.
          file build/armv7/valetudo
          file build/armv7/valetudo-lowmem
          file build/aarch64/valetudo

          file build/armv7/valetudo | grep -q 'ARM, EABI5'
          file build/armv7/valetudo-lowmem | grep -q 'ARM, EABI5'
          file build/aarch64/valetudo | grep -q 'ARM aarch64'

          # Generate the checksum manifest; it must fail if any file is absent.
          npm run build_release_manifest

          # Set the release version in the downloadable manifest.
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg version "$VERSION" \
            '.version = $version' \
            build/valetudo_release_manifest.json \
            > build/valetudo_release_manifest.json.tmp
          mv build/valetudo_release_manifest.json.tmp \
            build/valetudo_release_manifest.json

          # Check every recorded checksum against the actual file.
          jq -e '.sha256sums | length == 6' \
            build/valetudo_release_manifest.json >/dev/null

          jq -r '.sha256sums | to_entries[] | [.key, .value] | @tsv' \
            build/valetudo_release_manifest.json |
          while IFS="$(printf '\t')" read -r name expected; do
            case "$name" in
              valetudo-armv7)
                f=build/armv7/valetudo ;;
              valetudo-armv7-lowmem)
                f=build/armv7/valetudo-lowmem ;;
              valetudo-aarch64)
                f=build/aarch64/valetudo ;;
              valetudo-armv7.upx)
                f=build/armv7/valetudo.upx ;;
              valetudo-armv7-lowmem.upx)
                f=build/armv7/valetudo-lowmem.upx ;;
              valetudo-aarch64.upx)
                f=build/aarch64/valetudo.upx ;;
              *)
                echo "::error::Unexpected manifest entry: $name"
                exit 1 ;;
            esac

            actual="$(sha256sum "$f" | awk '{print $1}')"
            test "$actual" = "$expected" || {
              echo "::error::SHA256 mismatch: $name"
              exit 1
            }
          done

          test -s build/valetudo.openapi.schema.json

          # Ensure all voice files exist before creating the archive.
          for voice in \
            34 35 36 42 49 50 51 53 \
            70 91 92 93 96 98 99
          do
            test -s "assets/X40-Control/${voice}.ogg" || {
              echo "::error::Missing voice ${voice}.ogg"
              exit 1
            }
          done

          mkdir -p release-artifacts

          cp build/aarch64/valetudo release-artifacts/valetudo
          cp build/armv7/valetudo release-artifacts/valetudo-armv7
          cp build/armv7/valetudo-lowmem release-artifacts/valetudo-armv7-lowmem
          cp build/aarch64/valetudo release-artifacts/valetudo-aarch64

          cp build/armv7/valetudo.upx release-artifacts/valetudo-armv7.upx
          cp build/armv7/valetudo-lowmem.upx release-artifacts/valetudo-armv7-lowmem.upx
          cp build/aarch64/valetudo.upx release-artifacts/valetudo-aarch64.upx

          cp build/valetudo_release_manifest.json \
            release-artifacts/valetudo_release_manifest.json
          cp build/valetudo.openapi.schema.json \
            release-artifacts/valetudo-openapi.schema.json

          tar -czf release-artifacts/X40-Control-voices.tar.gz \
            -C assets/X40-Control \
            34.ogg 35.ogg 36.ogg 42.ogg 49.ogg 50.ogg 51.ogg \
            53.ogg 70.ogg 91.ogg 92.ogg 93.ogg 96.ogg 98.ogg 99.ogg

          test -s release-artifacts/X40-Control-voices.tar.gz

          VOICES_SHA256="$(sha256sum release-artifacts/X40-Control-voices.tar.gz | awk '{print $1}')"
          VOICES_SIZE="$(stat -c%s release-artifacts/X40-Control-voices.tar.gz)"
          SHA256="$(sha256sum release-artifacts/valetudo | awk '{print $1}')"
          SIZE="$(stat -c%s release-artifacts/valetudo)"

          echo "voices_sha256=${VOICES_SHA256}" >> "$GITHUB_OUTPUT"
          echo "voices_size=${VOICES_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

          echo "===== RELEASE ARTIFACTS ====="
          sha256sum release-artifacts/*
          du -h release-artifacts/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          cat > release-notes.md <<EOF2
          X40-Control ${VERSION}

          Binarios compilados y validados mediante GitHub Actions.

          Se incluyen binarios ARMv7, ARMv7 lowmem, ARM64,
          variantes UPX, manifiesto de hashes, esquema OpenAPI
          y paquete de voces X40-Control.
          EOF2

          gh release create "$TAG" \
            --draft \
            --title "X40-Control ${VERSION}" \
            --notes-file release-notes.md

          gh release upload "$TAG" \
            release-artifacts/valetudo \
            release-artifacts/valetudo-armv7 \
            release-artifacts/valetudo-armv7-lowmem \
            release-artifacts/valetudo-aarch64 \
            release-artifacts/valetudo-armv7.upx \
            release-artifacts/valetudo-armv7-lowmem.upx \
            release-artifacts/valetudo-aarch64.upx \
            release-artifacts/valetudo_release_manifest.json \
            release-artifacts/valetudo-openapi.schema.json \
            release-artifacts/X40-Control-voices.tar.gz

          # Publish only after every upload has succeeded.
          gh release edit "$TAG" --draft=false

      - name: Update OTA manifest after publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/valetudo"
          VOICES_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/X40-Control-voices.tar.gz"

          jq -n \
            --arg product "X40Control" \
            --arg version "$VERSION" \
            --arg channel "stable" \
            --arg asset "valetudo" \
            --arg url "$RELEASE_URL" \
            --arg sha256 "${{ steps.artifacts.outputs.sha256 }}" \
            --argjson size "${{ steps.artifacts.outputs.size }}" \
            --arg voices_url "$VOICES_URL" \
            --arg voices_sha256 "${{ steps.artifacts.outputs.voices_sha256 }}" \
            --argjson voices_size "${{ steps.artifacts.outputs.voices_size }}" \
            --arg changelog "$(git log -1 --pretty=%B)" \
            '{
              product: $product,
              version: $version,
              channel: $channel,
              asset: $asset,
              url: $url,
              sha256: $sha256,
              size: $size,
              voices_url: $voices_url,
              voices_sha256: $voices_sha256,
              voices_size: $voices_size,
              requires_reboot: true,
              changelog: [$changelog]
            }' > ota/manifest.json

          jq -e '
            .product == "X40Control" and
            (.sha256 | test("^[a-f0-9]{64}$")) and
            (.size > 0) and
            (.voices_sha256 | test("^[a-f0-9]{64}$")) and
            (.voices_size > 0)
          ' ota/manifest.json >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ota/manifest.json

          if git diff --cached --quiet; then
            echo "OTA manifest already up to date."
            exit 0
          fi

          git commit -m "chore: update OTA manifest to ${VERSION} [skip ci]"
          git push origin HEAD:main
