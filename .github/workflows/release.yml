name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-release:
    if: "!contains(github.event.head_commit.message, 'chore: update OTA manifest')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          set -e

          VERSION="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=ota-${VERSION}" >> "$GITHUB_OUTPUT"

          echo "VERSION=${VERSION}"
          echo "TAG=ota-${VERSION}"

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install
        run: npm ci

      - name: Generate OpenAPI Docs
        run: npm run build_openapi_schema

      - name: Build Valetudo frontend
        run: npm run build --workspace=frontend

      - name: Build Valetudo armv7
        run: npm run build_armv7 --workspace=backend

      - name: Build Valetudo armv7 lowmem
        run: npm run build_armv7_lowmem --workspace=backend

      - name: Build Valetudo aarch64
        run: npm run build_aarch64 --workspace=backend

      - name: UPX-compress valetudo binaries
        run: npm run upx

      - name: Build release manifest
        run: npm run build_release_manifest

      - name: Calculate OTA information
        id: ota
        run: |
          set -e

          SHA256="$(sha256sum ./build/armv7/valetudo | awk '{print $1}')"
          SIZE="$(stat -c%s ./build/armv7/valetudo)"

          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          cat > /tmp/release-notes.md <<EOF2
          X40-Control ${VERSION}

          Actualización automática desde main.

          Cambios:
          $(git log -1 --pretty=%B)
          EOF2

          gh release create "$TAG" \
            ./build/armv7/valetudo#valetudo-armv7 \
            ./build/armv7/valetudo#valetudo \
            ./build/armv7/valetudo-lowmem#valetudo-armv7-lowmem \
            ./build/aarch64/valetudo#valetudo-aarch64 \
            ./build/armv7/valetudo.upx#valetudo-armv7.upx \
            ./build/armv7/valetudo-lowmem.upx#valetudo-armv7-lowmem.upx \
            ./build/aarch64/valetudo.upx#valetudo-aarch64.upx \
            ./build/valetudo_release_manifest.json#valetudo_release_manifest.json \
            ./build/valetudo.openapi.schema.json#valetudo.openapi.schema.json \
            --title "X40-Control ${VERSION}" \
            --notes-file /tmp/release-notes.md

      - name: Update X40Control OTA manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/valetudo"

          SHA256="${{ steps.ota.outputs.sha256 }}"
          SIZE="${{ steps.ota.outputs.size }}"

          CHANGELOG="$(git log -1 --pretty=%B | jq -Rs 'split("\n") | map(select(length > 0))')"

          if [ "$CHANGELOG" = "[]" ]; then
            CHANGELOG='["Actualización de X40-Control"]'
          fi

          jq -n \
            --arg product "X40Control" \
            --arg version "$VERSION" \
            --arg channel "stable" \
            --arg asset "valetudo.x40control_final" \
            --arg url "$RELEASE_URL" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --argjson changelog "$CHANGELOG" \
            '{
              product: $product,
              version: $version,
              channel: $channel,
              asset: $asset,
              url: $url,
              sha256: $sha256,
              size: $size,
              requires_reboot: true,
              changelog: $changelog
            }' > ota/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ota/manifest.json

          if git diff --cached --quiet; then
            echo "OTA manifest already up to date."
            exit 0
          fi

          git commit -m "chore: update OTA manifest to ${VERSION} [skip ci]"
          git push origin HEAD:main
